<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Mapricot Price Desk</title>
<link rel="icon" type="image/svg+xml" href="/Mapricot-command-centre/favicon.svg" />
<script>
(function () {
  try {
    var s = localStorage.getItem('mcc-theme');
    var t = s === 'light' || s === 'dark' ? s : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<style>
:root { --bg:#f6f1ea; --card:#fff; --ink:#2a2118; --muted:#74685b; --line:#e5dccf; --soft:#f1e9dd; --accent:#a8541c; --accent-ink:#fff; --good:#2f6b3a; --bad:#b3261e; }
:root[data-theme="dark"] { --bg:#14110f; --card:#1e1a17; --ink:#f3ece4; --muted:#a79a8c; --line:#3a322b; --soft:#28221d; --accent:#e0a458; --accent-ink:#14110f; --good:#7fc58c; --bad:#ff8a7a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
#wm { position: fixed; inset: 0; pointer-events: none; z-index: 50; background-repeat: repeat; }

/* lock */
.lk { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lk-card { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.lk h1 { font-size: 22px; margin: 0 0 8px; }
.lk p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.lk form { display: grid; gap: 12px; }
.lk input[type=password] { width: 100%; padding: 12px; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; letter-spacing: .08em; }
.lk .go { padding: 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; cursor: pointer; }
.lk .go:disabled { opacity: .55; cursor: default; }
.lk label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 12px; }

/* app */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.bar h1 { font-size: 18px; margin: 0; }
.who { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.who button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }
.stale { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.tools { display: grid; gap: 10px; margin-bottom: 14px; }
.tools input[type=search] { width: 100%; padding: 12px 14px; font-size: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chips button { white-space: nowrap; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); }
.tw { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--soft); position: sticky; top: 0; }
td.r, th.r { text-align: right; }
tr.cat td { background: var(--soft); font-weight: 700; padding-top: 12px; }
tr.sub td { color: var(--muted); font-size: 13px; font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
.hi { font-weight: 700; }
.tiers { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.rec { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.rec summary { cursor: pointer; padding: 11px 14px; display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: baseline; list-style: none; }
.rec summary::-webkit-details-marker { display: none; }
.rec .code { font-weight: 700; font-size: 13px; color: var(--accent); }
.rec .body { padding: 0 14px 14px; }
.rec h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 20px; }
@media (max-width: 640px) { .rec summary { grid-template-columns: 1fr auto; } .rec .code { grid-column: 1 / -1; } th, td { padding: 8px 8px; } }
@media print { .top .who button, .tools, .tabs { display: none; } .top { position: static; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div id="wm" aria-hidden="true"></div>
<div id="app">
  <div class="lk"><div class="lk-card">
    <div class="eyebrow">Mapricot Foods Pvt. Ltd. · Internal</div>
    <h1>Price Desk</h1>
    <p>For the Mapricot team only. Enter your personal passcode. It is stored encrypted, and your name appears on every screen you open.</p>
    <form id="f">
      <input id="p" type="password" autocomplete="current-password" autofocus placeholder="Your passcode" aria-label="Passcode" />
      <button class="go" id="b" type="submit">Open</button>
      <label><input id="r" type="checkbox" checked /> Remember on this device</label>
    </form>
    <div class="err" id="e" role="alert"></div>
  </div></div>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'cc-pricedesk-pass-v1';
  var $ = function (i) { return document.getElementById(i); };
  var store = function (area, fn) { try { return fn(window[area]); } catch (e) { return null; } };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var inr = function (n, d) { if (n == null) return '—'; if (d == null) d = n >= 1000 ? 0 : (n > 0 && n < 0.1 ? 3 : 2); return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  var fmtDate = function (iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); };

  var cache = null;
  function load() { if (!cache) cache = fetch('data.enc.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('download ' + r.status); return r.json(); }); return cache; }
  async function aes(keyBytes, part) {
    var k = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(part.iv) }, k, b64(part.d));
  }
  async function gunzipJson(buf) { return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }

  async function open(pass) {
    var E = await load();
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' }, mat, 256);
    var me = null;
    for (var i = 0; i < E.slots.length && !me; i++) {
      try { me = JSON.parse(new TextDecoder().decode(await aes(new Uint8Array(bits), E.slots[i]))); } catch (e) { /* not this slot */ }
    }
    if (!me) { var bad = new Error('bad passcode'); bad.wrong = true; throw bad; }
    var team = await gunzipJson(await aes(b64(me.kt), E.team));
    var dir = me.kd ? await gunzipJson(await aes(b64(me.kd), E.dir)) : null;
    return { me: me, team: team, dir: dir };
  }

  function watermark(text) {
    var c = document.createElement('canvas'); c.width = 380; c.height = 230;
    var x = c.getContext('2d'); x.translate(190, 115); x.rotate(-Math.PI / 7);
    x.font = '600 15px system-ui, sans-serif'; x.textAlign = 'center'; x.fillStyle = 'rgba(128,118,108,0.2)';
    x.fillText(text, 0, 0);
    $('wm').style.backgroundImage = 'url(' + c.toDataURL() + ')';
  }

  var S = { tab: 'price', q: '', cat: 'all', rq: '', rcat: 'all' };
  var D = null;

  function shell() {
    var dir = D.me.role === 'director';
    $('app').innerHTML =
      '<div class="top"><div class="bar"><h1>Mapricot Price Desk</h1><div class="who"><span>' + esc(D.me.name) + '</span><button id="th" type="button">Theme</button><button id="pr" type="button">Print</button><button id="lo" type="button">Lock</button></div></div>' +
      (dir ? '<div class="tabs" role="tablist"><button role="tab" data-t="price">Price list</button><button role="tab" data-t="cost">Cost &amp; margin</button><button role="tab" data-t="rec">Recipe costing</button></div>' : '') + '</div>' +
      '<main id="main"></main>';
    $('lo').onclick = lock;
    $('pr').onclick = function () { window.print(); };
    $('th').onclick = function () { var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store('localStorage', function (a) { a.setItem('mcc-theme', t); }); };
    document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-t'); render(); window.scrollTo(0, 0); }; });
    render();
  }
  function lock() {
    store('sessionStorage', function (a) { a.removeItem(KEY); }); store('localStorage', function (a) { a.removeItem(KEY); });
    location.reload();
  }

  function stale(d) {
    return '<div class="stale">' + (D.me.role === 'director' ? 'Prices and costs' : 'Prices') + ' on this page are from <b>' + esc(fmtDate(d.asOf)) + '</b>. Raw-material rates may have moved since: confirm with the director before quoting a large order.</div>';
  }
  function chips(list, cur, attr) {
    return '<div class="chips">' + [{ key: 'all', label: 'All' }].concat(list).map(function (c) {
      return '<button type="button" data-' + attr + '="' + esc(c.key) + '" aria-pressed="' + (cur === c.key) + '">' + esc(c.label) + '</button>';
    }).join('') + '</div>';
  }
  function bindChips(attr, key) {
    document.querySelectorAll('[data-' + attr + ']').forEach(function (b) { b.onclick = function () { S[key] = b.getAttribute('data-' + attr); renderBody(); document.querySelectorAll('[data-' + attr + ']').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }; });
  }
  function match(q, s) { return !q || s.toLowerCase().indexOf(q) >= 0; }

  function render() {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-t') === S.tab)); });
    var m = $('main'), dir = D.me.role === 'director';
    var cats, ph;
    if (S.tab === 'rec') { cats = D.dir.recipes; ph = 'Search recipe code or name'; }
    else if (S.tab === 'cost') { cats = D.dir.pricing; ph = 'Search product'; }
    else { cats = D.team.categories; ph = 'Search product, e.g. classic tea'; }
    var stateKey = S.tab === 'rec' ? 'rq' : 'q', catKey = S.tab === 'rec' ? 'rcat' : 'cat';
    m.innerHTML = stale(S.tab === 'price' ? D.team : S.tab === 'rec' ? { asOf: D.dir.recipesAsOf } : D.dir) +
      '<div class="tools"><input id="q" type="search" placeholder="' + esc(ph) + '" aria-label="Search" value="' + esc(S[stateKey]) + '" autocomplete="off" />' + chips(cats, S[catKey], 'c') + '<div class="count" id="cnt"></div></div><div id="body"></div>' +
      '<div class="note">Confidential. For Mapricot staff only. Do not forward, photograph or share. Every screen carries ' + esc(D.me.name) + '’s name.</div>';
    $('q').oninput = function () { S[stateKey] = this.value.trim().toLowerCase(); renderBody(); };
    bindChips('c', catKey);
    renderBody();
  }

  function renderBody() {
    var b = $('body'), n = 0;
    if (S.tab === 'price') {
      var h = '<div class="tw"><table><thead><tr><th>Product</th><th>Pack</th><th class="r">Lowest price</th><th class="r">List price</th></tr></thead><tbody>';
      D.team.categories.forEach(function (c) {
        if (S.cat !== 'all' && S.cat !== c.key) return;
        var rowsHtml = '';
        c.sections.forEach(function (s) {
          var r = s.rows.filter(function (x) { return match(S.q, x.n + ' ' + c.label + ' ' + s.t); });
          if (!r.length) return;
          if (s.t && s.t.toLowerCase() !== c.label.toLowerCase()) rowsHtml += '<tr class="sub"><td colspan="4">' + esc(s.t) + '</td></tr>';
          r.forEach(function (x) { n++; rowsHtml += '<tr><td>' + esc(x.n) + '</td><td class="muted">' + esc(x.pk || '—') + '</td><td class="r num">' + inr(x.lo) + '</td><td class="r num hi">' + inr(x.hi) + '</td></tr>'; });
        });
        if (rowsHtml) h += '<tr class="cat"><td colspan="4">' + esc(c.label) + '</td></tr>' + rowsHtml;
      });
      b.innerHTML = n ? h + '</tbody></table></div>' : '<div class="empty">No product matches. Try a shorter word.</div>';
    } else if (S.tab === 'cost') {
      var h2 = '<div class="tw"><table><thead><tr><th>Product</th><th>Pack</th><th class="r">Cost</th><th>Price levels (lowest to highest)</th></tr></thead><tbody>';
      D.dir.pricing.forEach(function (c) {
        if (S.cat !== 'all' && S.cat !== c.key) return;
        var rh = '';
        c.sections.forEach(function (s) {
          var r = s.rows.filter(function (x) { return match(S.q, x.n + ' ' + c.label + ' ' + s.t); });
          if (!r.length) return;
          if (s.t && s.t.toLowerCase() !== c.label.toLowerCase()) rh += '<tr class="sub"><td colspan="4">' + esc(s.t) + '</td></tr>';
          r.forEach(function (x) {
            n++;
            var parts = [];
            if (x.cogs != null) parts.push('COGS ' + inr(x.cogs));
            if (x.tr != null) parts.push('transport ' + inr(x.tr));
            if (x.oc != null) parts.push('overhead ' + inr(x.oc));
            rh += '<tr><td>' + esc(x.n) + (x.note ? '<div class="muted" style="font-size:12px">' + esc(x.note) + '</div>' : '') + '</td><td class="muted">' + esc(x.pk || '—') + '</td>' +
              '<td class="r num"><div class="hi">' + inr(x.total) + '</div><div class="muted" style="font-size:12px">' + esc(parts.join(' · ')) + '</div></td>' +
              '<td><div class="tiers">' + (x.tiers.length ? x.tiers.map(function (t) { return '<span class="num">' + esc(t.l) + ' <b>' + inr(t.p) + '</b>' + (t.pr != null ? ' <span class="muted">(+' + inr(t.pr) + ')</span>' : '') + '</span>'; }).join('') : '<span>No price set</span>') + '</div></td></tr>';
          });
        });
        if (rh) h2 += '<tr class="cat"><td colspan="4">' + esc(c.label) + (c.priv ? ' · private-label deals' : '') + '</td></tr>' + rh;
      });
      b.innerHTML = n ? h2 + '</tbody></table></div>' : '<div class="empty">No product matches. Try a shorter word.</div>';
    } else {
      var h3 = '';
      D.dir.recipes.forEach(function (c) {
        if (S.rcat !== 'all' && S.rcat !== c.key) return;
        c.list.forEach(function (x) {
          if (!match(S.rq, x.code + ' ' + x.name + ' ' + c.label)) return;
          n++;
          var fin = x.sizes.map(function (z) { return z + ' ' + inr(x.final[z]); }).join(' · ');
          h3 += '<details class="rec" data-i="' + esc(c.key) + '|' + esc(x.code) + '"><summary><span class="code">' + esc(x.code) + '</span><span>' + esc(x.name) + '</span><span class="muted num" style="font-size:13px">' + esc(fin) + '</span></summary><div class="body"></div></details>';
        });
      });
      b.innerHTML = n ? h3 : '<div class="empty">No recipe matches. Try a shorter word.</div>';
      b.querySelectorAll('details.rec').forEach(function (d) {
        d.addEventListener('toggle', function () {
          if (!d.open || d.querySelector('.body').innerHTML) return;
          var ref = d.getAttribute('data-i').split('|'), cat = D.dir.recipes.filter(function (c) { return c.key === ref[0]; })[0];
          var x = cat.list.filter(function (r) { return r.code === ref[1]; })[0];
          var ing = '<h4>Ingredients (grams, rate per kg)</h4><div class="tw"><table><thead><tr><th>Ingredient</th><th class="r">Grams</th><th class="r">Rate / kg</th><th class="r">Amount</th></tr></thead><tbody>' +
            x.ing.map(function (i) { return '<tr><td>' + esc(i.n) + '</td><td class="r num">' + esc(i.q) + '</td><td class="r num">' + inr(i.r * 1000) + '</td><td class="r num">' + inr(i.a) + '</td></tr>'; }).join('') +
            '<tr><td><b>Batch total</b></td><td class="r num"><b>' + esc(x.batch ? x.batch.qty : '') + '</b></td><td></td><td class="r num"><b>' + inr(x.batch ? x.batch.amt : null) + '</b></td></tr></tbody></table></div>' +
            '<div class="count" style="margin-top:6px">Ingredient cost per kg: <b>' + inr(x.perKg) + '</b></div>';
          var pk = x.pkg.length ? '<h4>Packaging and final cost per pack</h4><div class="tw"><table><thead><tr><th>Item</th>' + x.sizes.map(function (z) { return '<th class="r">' + esc(z) + '</th>'; }).join('') + '</tr></thead><tbody>' +
            x.pkg.map(function (k) { return '<tr><td>' + esc(k.i) + '</td>' + x.sizes.map(function (z) { return '<td class="r num">' + (k.c[z] == null ? '—' : inr(k.c[z])) + '</td>'; }).join('') + '</tr>'; }).join('') +
            '<tr><td><b>Final cost</b></td>' + x.sizes.map(function (z) { return '<td class="r num"><b>' + inr(x.final[z]) + '</b></td>'; }).join('') + '</tr></tbody></table></div>' : '';
          d.querySelector('.body').innerHTML = ing + pk;
        });
      });
    }
    $('cnt').textContent = n + (S.tab === 'rec' ? ' recipe' : ' product') + (n === 1 ? '' : 's');
  }

  async function unlock(raw, fromSaved) {
    var p = String(raw).replace(/[\s-]/g, '').toUpperCase();
    var btn = $('b'); btn.disabled = true; btn.textContent = 'Opening…'; $('e').textContent = '';
    try {
      D = await open(p);
      store('sessionStorage', function (a) { a.setItem(KEY, p); });
      if ($('r') && $('r').checked) store('localStorage', function (a) { a.setItem(KEY, p); });
      watermark(D.me.name + ' · Mapricot confidential');
      shell();
    } catch (err) {
      if (err && err.wrong) { store('sessionStorage', function (a) { a.removeItem(KEY); }); store('localStorage', function (a) { a.removeItem(KEY); }); }
      if (!fromSaved && $('e')) $('e').textContent = err && err.wrong ? 'That passcode did not open the Price Desk.' : 'Could not open the Price Desk (' + (err && err.message || err) + '). Check your connection and try again.';
      if ($('b')) { $('b').disabled = false; $('b').textContent = 'Open'; }
    }
  }
  $('f').addEventListener('submit', function (ev) { ev.preventDefault(); if ($('p').value) unlock($('p').value, false); });
  if (!window.crypto || !crypto.subtle) $('e').textContent = 'This browser cannot open the Price Desk (it needs a secure https connection).';
  var saved = store('sessionStorage', function (a) { return a.getItem(KEY); }) || store('localStorage', function (a) { return a.getItem(KEY); });
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
